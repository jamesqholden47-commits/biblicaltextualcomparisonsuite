    <script>
        const CRUXES = [{"id": "acts15-amos9", "title": "Gentiles Seeking God vs. Israel Conquering Edom", "ref": "Acts 15:16–17 / Amos 9:11–12", "tier": "tier1-gold", "tier_name": "Tier 1: Ancient Vorlage Divergence", "testament": "OT / NT Synthesis", "category": "Gentile Salvation & Second Temple Vorlage", "summary": "St. James at the Council of Jerusalem settles the circumcision controversy by quoting Amos 9 from the Septuagint. The Hebrew Masoretic Text predicts a military conquest of Edom, making James's argument impossible on the Protestant Hebrew text.", "dolls": {"doll1_reading": {"label": "Doll 1: Master English Text (Acts 15:16–17)", "text": "‘After this I will return, and I will rebuild the tent of David that has fallen; I will rebuild its ruins, and I will restore it, that the remnant of mankind may seek the Lord, and all the Gentiles who are called by my name, says the Lord, who makes these things known from of old.’"}, "doll2_rationale": {"label": "Doll 2: Translation Rationale & Syntax Breakdown", "content": "The Greek clause uses the conjunction ὅπως ἄν (hopōs an) with the subjunctive ἐκζητήσωσιν (ekzētēsōsin, 'that they may seek diligently'), followed by the accusative τὸν Κύριον ('the Lord'). The grammatical subject is οἱ κατάλοιποι τῶν ἀνθρώπων ('the remnant of mankind'). The New Testament author faithfully reproduces the Septuagint's universal salvation theology rather than conforming the text to the nationalistic Hebrew Masoretic reading."}, "doll3_morphology": {"label": "Doll 3: Interlinear & Morphological Parsing", "words": [{"word": "ὅπως ἄν", "translit": "hopōs an", "pos": "Conjunction", "meaning": "in order that"}, {"word": "ἐκζητήσωσιν", "translit": "ekzētēsōsin", "pos": "Verb, Aorist Subjunctive Active 3P", "lemma": "ἐκζητέω (G1830)", "meaning": "may seek after"}, {"word": "οἱ κατάλοιποι", "translit": "hoi kataloipoi", "pos": "Noun, Nominative Masculine Plural", "lemma": "κατάλοιπος (G2645)", "meaning": "the remnant"}, {"word": "τῶν ἀνθρώ g forward human arguments, but roots the admission of the nations in the ancient voice of the prophet who spoke of mankind seeking God.’"}, {"author": "Council of Florence (1442, Cantate Domino)", "quote": "Defines the cessation of Mosaic legal ceremonies, pointing back to the apostolic decrees formulated on this prophecy."}]}}}, {"id": "heb10-ps40", "title": "A Body Prepared vs. Ears Dug / Pierced", "ref": "Hebrews 10:5–10 / Psalm 40:6–8", "tier": "tier1-gold", "tier_name": "Tier 1: Ancient Vorlage Divergence", "testament": "OT / NT Synthesis", "category": "Incarnation, Sacrifice & Christology", "summary": "Hebrews 10 argues that the Levitical animal sacrifices are abolished by Christ's Incarnate Body ('a body you prepared for me'). In the Hebrew Masoretic Text, the word 'body' does not exist; it reads 'ears you have dug for me.'", "dolls": {"doll1_reading": {"label": "Doll 1: Master English Text (Hebrews 10:5–7)", "text": "Consequently, when Christ came into the world, he said, ‘Sacrifices and offerings you have not desired, but a body you have prepared for me; in burnt offerings and sin offerings you have taken no pleasure. Then I said, Behold, I have come to do your will, O God, as it is written of me in the scroll of the book.’"}, "doll2_rationale": {"label": "Doll 2: Translation Rationale & Syntax Breakdown", "content": "The author of Hebrews bases his entire theological argument in verse 10 ('sanctified through the offering of the body of Jesus Christ once for all') upon the word σῶμα (sōma, 'body'). In verse 8–9, the author argues: 'He abolishes the first in order to establish the second.' If the Old Testament said only 'ears,' the physical offering of Christ's incarnate flesh as the replacement of animal sacrifice lacks its biblical prooftext."}, "doll3_morphology": {"label": "Doll 3: Interlinear & Morphological Parsing", "words": [{"word": "θυσίαν καὶ προσφοράν", "translit": "thysian kai prosphoran", "pos": "Noun, Accusative Feminine Singular", "meaning":                     </div>
                </article>
                `;
                stream.appendChild(card);
            });

            lucide.createIcons();
        }

        // Toggle individual doll drawer
        function toggleDoll(cruxId, dollNum) {
            const body = document.getElementById(`body-${cruxId}-${dollNum}`);
            const icon = document.getElementById(`icon-${cruxId}-${dollNum}`);
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                icon.setAttribute('data-lucide', 'chevron-up');
            } else {
                body.classList.add('hidden');
                icon.setAttribute('data-lucide', 'chevron-down');
            }
            lucide.createIcons();
        }

        function expandAllDolls() {
            CRUXES.forEach(c => {
                for (let i = 1; i <= 5; i++) {
                    const body = document.getElementById(`body-${c.id}-${i}`);
                    const icon = document.getElementById(`icon-${c.id}-${i}`);
                    if (body) body.classList.remove('hidden');
                    if (icon) icon.setAttribute('data-lucide', 'chevron-up');
                }
            });
            lucide.createIcons();
        }

        function collapseAllDolls() {
            CRUXES.forEach(c => {
                for (let i = 2; i <= 5; i++) {
                    const body = document.getElementById(`body-${c.id}-${i}`);
                    const icon = document.getElementById(`icon-${c.id}-${i}`);
                    if (body) body.classList.add('hidden');
                    if (icon) icon.setAttribute('data-lucide', 'chevron-down');
                }
            });
            lucide.createIcons();
        }

        function setFilter(tier) {
            currentFilter = tier;
            document.querySelectorAll('.tier-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === tier) {
                    btn.classList.add('ring-2', 'ring-amber-500');
                } else {
                    btn.classList.remove('ring-2', 'ring-amber-500');
                }
            });
            renderCruxes();
        }

        function filterCruxes() {
            renderCruxes();
        }

        // Copy formatted Discord card
        function copyDiscordCard(cruxId) {
            const c = CRUXES.find(x => x.id === cruxId);
            if (!c) return;

            let md = `**🏛️ PLENARY SCRIPTURE APPARATUS: ${c.title}**\n`;
            md += `**Reference:** \`${c.ref}\` | **Classification:** \`${c.tier_name}\`\n\n`;
            md += `> **Forensic Summary:** ${c.summary}\n\n`;
            md += `**📖 Master Reading (Doll 1):**\n"${c.dolls.doll1_reading.text}"\n\n`;
            md += `**📜 Multi-Witness Manuscript Breakdown (Doll 4):**\n`;
            c.dolls.doll4_apparatus.witnesses.forEach(w => {
                md += `• **${w.source}:** \`${w.text}\` (${w.gloss})\n`;
            });
            md += `\n**⚖️ Textual Verdict:** *${c.dolls.doll4_apparatus.verdict}*\n`;
            md += `\n*Compiled via The Russian Doll Scripture Engine*`;

            navigator.clipboard.writeText(md).then(() => {
                alert('Copied Discord Apologetics Card to clipboard! Ready to paste into Discord.');
            }).catch(() => {
                prompt('Copy your Discord card below:', md);
            });
        }

        // 3D Spatial Strata Mode (Three.js)
        function toggle3DMode() {
            const container = document.getElementById('three-container');
            const btnText = document.getElementById('toggle3DText');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btnText.textContent = "Close 3D Spatial Mode";
                is3DActive = true;
                initThreeJS();
            } else {
                container.classList.add('hidden');
                btnText.textContent = "3D Spatial Strata Mode";
                is3DActive = false;
            }
        }

        function initThreeJS() {
            if (scene) return; // already initialized

            const container = document.getElementById('three-container');
            const canvas = document.getElementById('three-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05070d);
            scene.fog = new THREE.FogExp2(0x05070d, 0.0015);

            camera = new THREE.PerspectiveCamera(45, width / height, 1, 2000);
            camera.position.set(0, 180, 500);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const pointLight = new THREE.PointLight(0x38bdf8, 2, 800);
            pointLight.position.set(100, 250, 200);
            scene.add(pointLight);

            const goldLight = new THREE.PointLight(0xfbbf24, 1.5, 800);
            goldLight.position.set(-150, -100, 100);
            scene.add(goldLight);

            strataGroup = new THREE.Group();
            scene.add(strataGroup);

            // Create 5 Holographic Manuscript Strata Planes along Z-Axis
            const strataConfigs = [
                { name: "Stratum 0: English Vernacular", color: 0xfbbf24, z: 120, opacity: 0.85 },
                { name: "Stratum 1: Critical Greek (NA28)", color: 0x38bdf8, z: 60, opacity: 0.75 },
                { name: "Stratum 2: 4th-c Uncials (Vaticanus B)", color: 0xa855f7, z: 0, opacity: 0.65 },
                { name: "Stratum 3: 2nd-c Papyri (P46/P75)", color: 0x10b981, z: -60, opacity: 0.55 },
                { name: "Stratum 4: Qumran Hebrew Vorlage (4QSamª)", color: 0xf43f5e, z: -120, opacity: 0.45 }
            ];

            const planeGeo = new THREE.PlaneGeometry(360, 90);

            strataConfigs.forEach((cfg, i) => {
                const mat = new THREE.MeshPhongMaterial({
                    color: cfg.color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: cfg.opacity,
                    wireframe: false,
                    shininess: 80
                });

                const mesh = new THREE.Mesh(planeGeo, mat);
                mesh.position.set(0, (i - 2) * -35, cfg.z);
                mesh.rotation.x = -Math.PI / 8;
                strataGroup.add(mesh);

                // Add wireframe border
                const wireGeo = new THREE.EdgesGeometry(planeGeo);
                const wireMat = new THREE.LineBasicMaterial({ color: cfg.color, linewidth: 2 });
                const wire = new THREE.LineSegments(wireGeo, wireMat);
                mesh.add(wire);
            });

            // Interactive mouse rotation
            let isDragging = false;
            let prevMouseX = 0;
            let prevMouseY = 0;

            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });

            window.addEventListener('mouseup', () => isDragging = false);

            canvas.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const deltaX = e.clientX - prevMouseX;
                const deltaY = e.clientY - prevMouseY;
                strataGroup.rotation.y += deltaX * 0.005;
                strataGroup.rotation.x += deltaY * 0.005;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });

            window.addEventListener('resize', () => {
                if (!is3DActive) return;
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });

            function animate() {
                requestAnimationFrame(animate);
                if (!isDragging) {
                    strataGroup.rotation.y += 0.0015;
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderCruxes();
        });
    </script>
</body>
</html>

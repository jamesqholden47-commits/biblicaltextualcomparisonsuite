    let currentCategory = "ALL";

    function renderLoci(data) {
      const container = document.getElementById("loci-container");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-dim);">No forensic loci match your criteria.</div>`;
        return;
      }

      data.forEach(locus => {
        const card = document.createElement("div");
        card.className = "locus-card";
        card.id = `card-${locus.id}`;

        let streamsHtml = locus.streams.map(stream => `
          <div class="stream-card">
            <div class="stream-header">
              <span class="stream-name">${stream.name}</span>
              <span class="stream-date">${stream.date}</span>
            </div>
            <div class="stream-text">${stream.text}</div>
            <div class="stream-gloss">${stream.gloss}</div>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="locus-header" onclick="toggleLocus('${locus.id}')">
            <div class="locus-title-group">
              <span class="locus-ref">${locus.ref}</span>
              <span class="badge-tag ${locus.badgeClass}">${locus.badge}</span>
              <span class="locus-theme">${locus.theme}</span>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-${locus.id}"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="locus-body" id="body-${locus.id}">
            <div class="synoptic-grid">
              ${streamsHtml}
            </div>
            <div class="autopsy-banner">
              <div class="autopsy-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Forensic Autopsy & Manuscript Verdict
              </div>
              <div>${locus.autopsy}</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById("total-loci-badge").innerText = `${data.length} Forensic Loci`;
    }

    function toggleLocus(id) {
      const body = document.getElementById(`body-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      if (body.style.display === "none") {
        body.style.display = "flex";
        icon.style.transform = "rotate(0deg)";
      } else {
        body.style.display = "none";
        icon.style.transform = "rotate(-90deg)";
      }
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterLoci();
    }

    function filterLoci() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = LOCI_DATA.filter(item => {
        const matchesCategory = (currentCategory === "ALL" || item.category === currentCategory || item.badgeClass.includes(currentCategory.toLowerCase()));
        const matchesQuery = item.ref.toLowerCase().includes(query) ||
                             item.theme.toLowerCase().includes(query) ||
                             item.autopsy.toLowerCase().includes(query) ||
                             item.streams.some(s => s.text.toLowerCase().includes(query) || s.gloss.toLowerCase().includes(query));
        return matchesCategory && matchesQuery;
      });
      renderLoci(filtered);
    }

    // Initial render
    renderLoci(LOCI_DATA);
  </script>
</body>
</html>

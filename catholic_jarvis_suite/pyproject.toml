[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catholic-jarvis-suite"
version = "0.1.0"
description = "Catholic Jarvis & Plenary Logos Suite — FastAPI backend, scholarly research workspace, and lazy-loaded biblical/patristic corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "PyMuPDF>=1.24.0",
    "edge-tts>=6.1.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
